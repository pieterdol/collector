server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and cover images go to the backend; the browser sees one origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Launcher library files are multi-megabyte (a legendary dump of
        # 300 games is ~4 MB); nginx's 1 MB default would 413 them. The
        # backend enforces its own 40 MB cap.
        client_max_body_size 40m;
        # Imports fetch and classify before responding; don't cut them off.
        proxy_read_timeout 300s;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker itself.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
